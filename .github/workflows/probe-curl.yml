name: probe-curl
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          for u in https://www.immojeune.com/logement-etudiant/lyon-69.html https://www.studapart.com/fr/location-studio-lyon https://www.jinka.fr/ https://www.habitatjeunes.org/logements/; do
            curl -sL -m 30 -A "$UA" -o p.html -w "$u %{http_code} %{size_download}" "$u"; echo " euro=$(grep -o '€' p.html | wc -l)"
          done
