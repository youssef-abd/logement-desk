name: probe-scrapling

# Throwaway test: does Scrapling get through where plain requests are blocked? By hand only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "scrapling[fetchers]"
      - run: scrapling install
      - run: python scripts/probe_scrapling.py
