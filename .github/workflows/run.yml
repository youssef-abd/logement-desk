name: run

# Real run or dry check. By hand for now: gh workflow run run.yml -f mode=full|check
# (the Cloudflare Worker cron that dispatches it comes with plan 2).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = real run and save state, check = dry run that writes nothing"
        type: choice
        options: [full, check]
        default: full
      deep:
        description: "deep sweep: all result pages (hourly), otherwise page 1 only"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: logement-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      DESK_URL: ${{ secrets.DESK_URL }}
      PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Git identity for the state commit
        run: |
          git config user.name "logement-desk[bot]"
          git config user.email "logement-desk@users.noreply.github.com"
      - name: Chrome for the browser-based sources (deep sweep only)
        if: inputs.deep
        run: playwright install --with-deps chromium
      - name: Scrape
        env:
          CHECK_FLAG: ${{ inputs.mode == 'check' && '--check' || '' }}
          DEEP_FLAG: ${{ inputs.deep && '--deep' || '' }}
        run: python -m logement.run $CHECK_FLAG $DEEP_FLAG
      - name: Save state
        if: always() && inputs.mode != 'check'
        run: bash scripts/save_state.sh
      - name: Publish to the desk (stores the listings, sends the phone alerts)
        if: inputs.mode != 'check' && env.DESK_URL != ''
        run: python scripts/publish.py
      - name: Phone alert if the run failed
        if: failure() && env.NTFY_TOPIC != ''
        run: curl -s -d "logement-desk run failed" "https://ntfy.sh/${NTFY_TOPIC}" > /dev/null
